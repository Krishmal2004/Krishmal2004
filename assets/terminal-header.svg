<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
<style>
  text { font-family: Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace; }
  .l { opacity: 0; animation: in .35s ease-out forwards; }
  .cur { animation: blink 1s steps(1) infinite; }
  .scan { animation: scan 6s linear infinite; }
  .glow { animation: pulse 3s ease-in-out infinite; }
  @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(470px); } }
  @keyframes pulse { 0%,100% { stroke-opacity: .35; } 50% { stroke-opacity: .9; } }
</style>
<defs>
  <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/><stop offset=".5" stop-color="#00ff9c" stop-opacity=".08"/><stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
  </linearGradient>
  <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" fill-opacity=".025"/></pattern>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="win"><rect x="10" y="10" width="880" height="450" rx="12"/></clipPath>
  <clipPath id="type1"><rect x="0" y="50" height="40" width="0"><animate attributeName="width" from="0" to="900" begin=".3s" dur="1.1s" fill="freeze"/></rect></clipPath>
</defs>
